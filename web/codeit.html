<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Training in Dharan, Nepal</title>
    <link rel="stylesheet" href="./codeit.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

</head>

<body>
    <div class="header-wrapper">
        <div class="header container">
            <div>
                <img class="logo-image" src="./images/codeit-logo.webp" alt="codeit logo">
            </div>
            <div class="contact-info">
                <div class="contact-wrapper">
                    <i class="fa fa-headphones" aria-hidden="true"></i>

                    <div>
                        <div class="contact-heading">
                            Enquiry
                        </div>
                        <div class="contact">
                            +977-25-575163
                        </div>
                    </div>
                </div>
                <div class="contact-wrapper">
                    <i class="fa fa-phone" aria-hidden="true"></i>

                    <div>
                        <div class="contact-heading">Technical support</div>
                        <div class="contact">
                            +977-9704508525
                        </div>
                    </div>
                </div>
                <div class="contact-wrapper">
                    <i class="fa fa-whatsapp" aria-hidden="true"></i>
                    <div>
                        <div class="contact-heading">Community</div>
                        <div class="contact">+977-9862130505</div>
                    </div>
                </div>



            </div>
            <div class="search-login">
                <div class="search-box">
                    <img src="./icons/search.png" alt="search-logo">
                    <input type="text" placeholder="Search courses...">

                </div>
                <div class="login">
                    <i class="fa fa-sign-in" aria-hidden="true"></i>
                    <a href="">

                        Login</a>
                </div>

            </div>
        </div>
    </div>

    <div class="hero-section container">
        <div class="left">
            <div class="mini-badges">
                <div>students trained</div>
                <div>access and support</div>
                <div>recorded video</div>
                <div>google rating</div>

            </div>
        </div>
        <div class="right">
            <img src="./codeit.avif" alt="">
        </div>
    </div>



</body>

</html>
